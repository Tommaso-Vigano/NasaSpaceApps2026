<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ region.title }} | MarsWalk</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='region.css') }}">
</head>
<body>
    <canvas id="region-canvas" aria-label="Regional map. Drag to pan; scroll to zoom."></canvas>
    <div id="terrain-view" aria-label="Read-only 3D terrain preview" hidden></div>
    <div class="terrain-tools">
        <label for="mesh-detail">Mesh detail <output id="mesh-detail-value">192</output></label>
        <input id="mesh-detail" type="range" min="64" max="512" step="64" value="192">
        <button id="terrain-toggle" type="button" aria-label="Show 3D terrain" title="Show 3D terrain" aria-pressed="false">
            <svg class="terrain-icon-3d" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5v8l-9 5-9-5V8zM3 8l9 5 9-5M12 13v8"/></svg>
            <svg class="terrain-icon-2d" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 4v16"/></svg>
        </button>
        <p id="terrain-status" role="status" hidden></p>
    </div>
    <header>
        <a class="back-link" href="{{ url_for('planet') }}" aria-label="Back to Mars" title="Back to Mars">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
        </a>
        <h1>{{ region.title }}</h1>
    </header>
    <aside class="routing-panel" aria-label="Route planning">
        <div class="mouse-coordinate"><span>Cursor (lat, lon)</span>
            <output id="mouse-coordinate">-</output></div>
        <ul id="route-endpoints" aria-label="Endpoints in latitude, longitude" title="Right-click the map to set Start, then End."><li>Start: —</li><li>End: —</li></ul>
        <label for="subdivisions">Subdivisions <output id="subdivision-value">100</output></label>
        <input id="subdivisions" type="range" min="10" max="1000" step="1" value="100">
        <small id="grid-estimate"></small>
        <div class="route-actions">
            <button id="calculate-route" disabled>Find route</button>
            <button id="clear-endpoints" disabled>Clear points</button>
        </div>
        <p id="route-status" role="status"></p>
        <button id="route-profile-button" type="button" hidden>Route profile</button>
    </aside>
    <div class="constraints-dock">
        <div class="profile-settings">
            <button id="profile-settings-button" type="button" aria-label="Routing profile: Human"
                    title="Routing profile: Human" aria-expanded="false" aria-controls="profile-panel">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m9.5 3-.5 2-2 1.2-2-.6-2.5 4.3L4 11.3v2l-1.5 1.4L5 19l2-.6 2 1.2.5 2.4h5l.5-2.4 2-1.2 2 .6 2.5-4.3-1.5-1.4v-2l1.5-1.4L19 5.6l-2 .6L15 5l-.5-2z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </button>
            <section id="profile-panel" aria-label="Routing settings" hidden>
                <label for="routing-profile">Routing profile</label>
                <select id="routing-profile">
                    <option value="human">Human</option>
                    <option value="rover">Rover</option>
                </select>
            </section>
        </div>
    <aside class="constraints-panel" aria-label="Constraint views">
        <h2>Constraints</h2>
        <p id="constraints-status">Available after routing.</p>
        <div id="constraint-options"></div>
    </aside>
    </div>
    {% if region.photos_url %}
    <div id="photo-markers" aria-label="Perseverance photo stops"></div>
    <aside class="photos-control" aria-label="Mission photos">
        <label><input id="photos-visible" type="checkbox" checked> Perseverance photos</label>
        <small id="photos-status" role="status">Loading stops…</small>
    </aside>
    <dialog id="photo-stop" aria-labelledby="photo-stop-title">
        <div class="photo-heading"><strong id="photo-stop-title"></strong>
            <button id="photo-stop-close" aria-label="Close photo stop">&times;</button></div>
        <p id="photo-stop-coordinates"></p>
        <div id="photo-thumbnails"></div>
    </dialog>
    <dialog id="photo-viewer" aria-label="Perseverance mission photo">
        <div class="photo-heading"><strong>Perseverance</strong>
            <button id="photo-viewer-close" aria-label="Close photo">&times;</button></div>
        <figure><img id="photo-full" alt=""><figcaption id="photo-caption"></figcaption></figure>
    </dialog>
    {% endif %}
    <dialog id="route-statistics" aria-labelledby="route-statistics-title">
        <div class="route-chart-heading">
            <h2 id="route-statistics-title">Altitude</h2>
            <select id="route-measurement" aria-label="Route measurement" hidden></select>
            <button id="route-statistics-close" type="button" aria-label="Close route profile">&times;</button>
        </div>
        <svg id="route-chart" role="img" aria-label="Altitude along the route"></svg>
        <p id="route-chart-summary"></p>
    </dialog>
    <nav class="map-controls" aria-label="Map controls">
        <button id="zoom-in" aria-label="Zoom in">+</button>
        <button id="zoom-out" aria-label="Zoom out">&minus;</button>
        <button id="fit-region">Fit selection</button>
    </nav>
    <p id="map-status" role="status">Loading region...</p>
    <script id="region-config" type="application/json">{{ region | tojson }}</script>
    <script src="{{ url_for('static', filename='region_photos.js') }}"></script>
    <script src="{{ url_for('static', filename='region_overlays.js') }}"></script>
    <script src="{{ url_for('static', filename='region_terrain.js') }}"></script>
    <script src="{{ url_for('static', filename='route_statistics.js') }}"></script>
    <script src="{{ url_for('static', filename='region.js') }}"></script>
</body>
</html>
