<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mars</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <canvas id="globe"></canvas>
    <section id="region-panel" class="region-panel" aria-label="Region of interest">
        <strong>Region of interest</strong>
        <p id="region-status" role="status">Right-drag on Mars to select a region.</p>
        <dl id="region-bounds" hidden>
            <dt>Top left (latitude, longitude)</dt><dd id="region-top-left"></dd>
            <dt>Bottom right (latitude, longitude)</dt><dd id="region-bottom-right"></dd>
        </dl>
        <button id="region-clear" type="button" hidden>Clear selection</button>
        <button id="region-confirm" type="button" hidden disabled>Explore region</button>
    </section>

    <!-- Selected landmark -->
    <div id="label" class="label" hidden>
        <button id="label-close" class="label-close" type="button" aria-label="Close">&times;</button>
        <h2 id="label-name" class="label-name"></h2>
        <p id="label-meta" class="label-meta"></p>
        <p id="label-detail" class="label-detail" hidden></p>
        <p id="label-coords" class="label-coords"></p>
    </div>

    <!-- Legend (bottom left). Filled from the JSON by main.js -->
    <aside id="legend" class="panel legend" data-open="true">
        <button class="panel-head" type="button" aria-expanded="true" aria-controls="legend-body">
            <span>Legend</span>
            <svg class="chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>
        </button>
        <div id="legend-body" class="panel-body"></div>
    </aside>

    <!-- The active colour scale sits beside the display controls. -->
    <div class="display-panels">
        <aside id="layer-legend" aria-label="Layer colour scale" hidden>
            <strong id="layer-legend-title"></strong>
            <div id="layer-scale" class="layer-scale">
            <div id="layer-gradient" class="layer-gradient"></div>
            <div class="layer-range"><span id="layer-min"></span><span id="layer-max"></span></div>
            </div>
            <small id="layer-units"></small>
        </aside>
    <aside id="controls" class="panel controls" data-open="true">
        <button class="panel-head" type="button" aria-expanded="true" aria-controls="controls-body">
            <span>Display</span>
            <svg class="chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>
        </button>
        <div id="controls-body" class="panel-body">
            <section class="control-section" aria-label="Layers">
                <div class="section-head">Layers</div>
                <label class="row" style="--c: #80d9bb">
                    <span class="swatch swatch-dot" aria-hidden="true"></span>
                    <span class="row-label">Elevation coverage</span>
                    <input id="coverage-visible" type="checkbox" checked>
                    <span class="switch" aria-hidden="true"></span>
                </label>
                <p id="coverage-status" class="coverage-status" role="status">Loading coverage...</p>
            </section>
            <section id="marker-controls" class="control-section" aria-label="Markers"></section>
        </div>
    </aside>
    </div>

    <button id="rotate-toggle" class="toggle" type="button" aria-pressed="false">
        <svg class="icon icon-pause" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/>
        </svg>
        <svg class="icon icon-play" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4 2.5v11a.8.8 0 0 0 1.2.7l9-5.5a.8.8 0 0 0 0-1.4l-9-5.5A.8.8 0 0 0 4 2.5z"/>
        </svg>
        <span class="toggle-text">Pause rotation</span>
    </button>

    <nav class="layer-bar" aria-label="Planet visualization">
        <div class="layer-bar-title">Visualize Mars</div>
        <div id="layer-options" class="layer-options" role="group" aria-label="Surface mode">
            <button type="button" data-layer="surface" aria-pressed="true">Surface</button>
        </div>
        <p id="layer-status" role="status">Surface imagery</p>
    </nav>

    <div id="loading" class="loading">Loading Mars…</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="{{ url_for('static', filename='main.js') }}"
            data-landmarks-url="{{ url_for('globe_landmarks') }}"
            data-coverage-url="{{ url_for('elevation_coverage') }}"
            data-layers-url="{{ url_for('globe_layer_catalog') }}"
            data-static-url="{{ url_for('static', filename='') }}"></script>
</body>

</html>
